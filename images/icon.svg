<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône du plugin : un éclair (le flash) devant une roue des 8 couleurs de l'onglet « Par couleur ». L'éclair va du
       blanc au jaune : une lumière forte qui tend vers le blanc sans être coupée. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22324f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fff6c9"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#background)"/>

  <!-- Roue des couleurs : rayon 168, 8 arcs de 45° (circonférence 1055,6, soit 131,9 par arc) -->
  <g fill="none" stroke-width="46">
    <circle cx="256" cy="256" r="168" stroke="#ef4e4e" stroke-dasharray="122 933.6" transform="rotate(-108 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#f98a35" stroke-dasharray="122 933.6" transform="rotate(-63 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#f7d13d" stroke-dasharray="122 933.6" transform="rotate(-18 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#58c95f" stroke-dasharray="122 933.6" transform="rotate(27 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#3fd0d6" stroke-dasharray="122 933.6" transform="rotate(72 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#3f8cf0" stroke-dasharray="122 933.6" transform="rotate(117 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#8d5cf0" stroke-dasharray="122 933.6" transform="rotate(162 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#e552c4" stroke-dasharray="122 933.6" transform="rotate(207 256 256)"/>
  </g>

  <!-- Éclair -->
  <path d="M 296 72 L 156 284 H 238 L 208 440 L 356 214 H 270 Z" fill="url(#bolt)" stroke="#fff" stroke-width="6"
        stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
